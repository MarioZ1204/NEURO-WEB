name: 🚀 Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Hostinger via FTP
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: 📥 Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Use FTPS (FTP over TLS) for encrypted transfers
          protocol: ftps
          # Deploy to the FTP user's home directory (root of the FTP account).
          # Adjust this path if your Hostinger FTP user is not rooted at the
          # site home (e.g. change to /public_html/ if only uploading the
          # public_html folder).
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/DO_NOT_UPLOAD_HERE
